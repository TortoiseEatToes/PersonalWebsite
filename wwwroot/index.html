<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Core -->
    <meta charset="utf-8" />
    <title>TortoiseEatToes</title>
    <meta name="description" content="Sara Asmussen's personal website">
    <meta name="keywords" content="C#, Blazor">
    <meta name="author" content="Sara Asmussen">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/PersonalWebsite/" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="icon" type="image/gif" href="hamsterIdle.gif" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="TortoiseEatToes">
    <meta property="og:title" content="I make cool tools with cool people!">
    <meta property="og:description" content="This is my personal website with links and blogs about all the cool things I've been up to'.">
    <meta property="og:image" content="https://tortoiseeattoes.github.io/PersonalWebsite">
    <meta property="og:image:width" content="400">
    <meta property="og:image:height" content="400">

    <!-- Other Tags -->
    <meta name="theme-color" content="#1a1a26">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Scripts -->
    <script type="importmap"></script>
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="PersonalWebsite.styles.css" />
</head>

<body style="background-color: #1a1a26;">
    <div id="app">
        <div class="loading-animation">
            <img src="images/hamsterIdle.gif" alt="Hamster Idle" style="width:400px;height:400px;" />
            <h1 style="color: #b2b0be; max-width: 80%">Getting things ready for you</h1>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>

</html>
